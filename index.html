<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio - Projets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./styles.css">
</head>

<!-- python -m http.server 5500 
    http://localhost:5500/index.html
-->

<body data-page="home">
  <div class="portfolio-shell">
    <header class="hero container-fluid px-0">
      <h1 class="hero-title">Mon Portfolio</h1>
      <p class="hero-subtitle">Découvrez mes projets et réalisations. Cliquez sur une carte pour voir les détails.</p>
    </header>

    <section class="projects-section container-fluid px-0">
      <h2 class="section-title">Mes Projets</h2>
      <div class="cards-carousel" id="projects-carousel">
        <button class="carousel-nav carousel-nav-prev" id="carousel-prev" type="button" aria-label="Projet précédent">
          &#8249;
        </button>
        <div class="cards-scroller" id="cards-scroller" aria-label="Liste des projets"></div>
        <button class="carousel-nav carousel-nav-next" id="carousel-next" type="button" aria-label="Projet suivant">
          &#8250;
        </button>
      </div>
      <div class="carousel-dots" id="carousel-dots" aria-label="Navigation des projets"></div>
    </section>
  </div>

  <script src="./projects.js"></script>
  <script src="./script.js"></script>
</body>
</html>
